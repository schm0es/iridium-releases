# Builds a tag of the (private) iridium source and publishes it here: the Tauri
# bundles for every platform (the updater ones signed with the updater key),
# latest.json (what installed apps check for updates) and install.sh /
# install.ps1 (the curl and PowerShell installers).
# Started by scripts/release.sh in the source repo, or by hand from the Actions tab.
name: release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source tag to build, e.g. v0.2.0 (the workspace version in its Cargo.toml and src-tauri/tauri.conf.json must say 0.2.0); a commit works for a draft"
        required: true
      notes:
        description: "Release notes"
        default: ""
      draft:
        description: "Publish as a draft (not offered to installs and updates until published)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Static GPL ffmpeg for the Windows installer (gyan.dev's builds, versioned releases).
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip
  FFMPEG_SHA256: 60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: ubuntu-22.04-arm, name: linux-aarch64 }
          - { os: macos-latest, name: macos-universal }
          - { os: windows-latest, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: schm0es/iridium
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}

      - name: Version
        id: version
        env:
          REF: ${{ inputs.ref }}
          DRAFT: ${{ inputs.draft }}
        run: |
          v=$(awk '/^\[workspace\.package\]/ { f = 1; next } /^\[/ { f = 0 } f && /^version *=/ { gsub(/^[^"]*"|".*$/, ""); print; exit }' Cargo.toml)
          if [ -z "$v" ]; then echo "::error::no [workspace.package] version in Cargo.toml"; exit 1; fi
          if [ "v$v" != "$REF" ] && [ "$DRAFT" != true ]; then echo "::error::$REF is not v$v (Cargo.toml)"; exit 1; fi
          # The updater compares against the version in tauri.conf.json, so it must agree.
          c=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$c" != "$v" ]; then echo "::error::src-tauri/tauri.conf.json says $c, Cargo.toml says $v"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      # WebKitGTK 4.1 and the Tauri build libraries, plus the GStreamer plugins the
      # AppImage bundles (bundleMediaFramework) so audio and video play in the web view.
      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl wget file xdg-utils libwebkit2gtk-4.1-dev libgtk-3-dev \
            libdbus-1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libfuse2 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-libav

      - run: npm ci

      # ffmpeg.exe and ffprobe.exe become Tauri resources (src-tauri/tauri.windows.conf.json),
      # installed in <install dir>\bin, where the app looks first.
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          curl -fsSL -o ffmpeg.zip "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  ffmpeg.zip" | sha256sum -c -
          mkdir -p src-tauri/resources/bin
          pwsh -NoProfile -Command '
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $zip = [IO.Compression.ZipFile]::OpenRead("ffmpeg.zip")
            foreach ($e in $zip.Entries) {
              if ($e.FullName -match "/bin/(ffmpeg|ffprobe)\.exe$") {
                [IO.Compression.ZipFileExtensions]::ExtractToFile($e, "src-tauri/resources/bin/$($e.Name)", $true)
              }
            }
            $zip.Dispose()'
          ls -l src-tauri/resources/bin

      # tauri build signs the updater bundles (AppImage, .app.tar.gz, setup.exe) with
      # the updater key and writes a .sig beside each one.
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          case "$RUNNER_OS" in
            Linux) npx tauri build --bundles appimage,deb,rpm ;;
            macOS) npx tauri build --target universal-apple-darwin --bundles app --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}' ;;
            Windows) npx tauri build --bundles nsis ;;
          esac

      # Stable asset names; a .sig stays valid under a new name (it signs the bytes).
      - name: Stage
        env:
          NAME: ${{ matrix.name }}
        run: |
          mkdir -p out
          bundle=target/release/bundle
          if [ "$RUNNER_OS" = macOS ]; then bundle=target/universal-apple-darwin/release/bundle; fi
          take() { # take <glob> <asset> [sig]
            local f; f=$(ls $1 2>/dev/null | head -1)
            [ -n "$f" ] || { echo "::error::no build output matching $1"; exit 1; }
            cp "$f" "out/$2"
            if [ "${3:-}" = sig ]; then
              [ -f "$f.sig" ] || { echo "::error::$f.sig is missing (is TAURI_SIGNING_PRIVATE_KEY set?)"; exit 1; }
              cp "$f.sig" "out/$2.sig"
            fi
          }
          case "$RUNNER_OS" in
            Linux)
              take "$bundle/appimage/*.AppImage" "iridium-$NAME.AppImage" sig
              take "$bundle/deb/*.deb" "iridium-$NAME.deb"
              take "$bundle/rpm/*.rpm" "iridium-$NAME.rpm" ;;
            macOS) take "$bundle/macos/*.app.tar.gz" "iridium-$NAME.app.tar.gz" sig ;;
            Windows) take "$bundle/nsis/*-setup.exe" "iridium-$NAME-setup.exe" sig ;;
          esac
          # What the installers download and verify.
          cd out
          for f in *.AppImage *.app.tar.gz *-setup.exe; do
            if [ -f "$f" ]; then { sha256sum "$f" 2>/dev/null || shasum -a 256 "$f"; } > "$f.sha256"; fi
          done
          ls -l

      # No Windows machine checks a release otherwise: install it silently, see that
      # the bundled ffmpeg and the Default apps registration are in place, and that
      # the app starts and stays up.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process ./out/iridium-windows-x86_64-setup.exe -ArgumentList '/S' -Wait
          $dir = "$env:LOCALAPPDATA\Iridium"
          foreach ($f in 'iridium.exe', 'bin\ffmpeg.exe', 'bin\ffprobe.exe') {
            if (-not (Test-Path "$dir\$f")) { throw "not installed: $dir\$f" }
          }
          if (-not (Get-ItemProperty 'HKCU:\Software\RegisteredApplications' -Name Iridium -ErrorAction SilentlyContinue)) {
            throw 'Iridium is not registered for Default apps'
          }
          $p = Start-Process "$dir\iridium.exe" -PassThru
          Start-Sleep 15
          if ($p.HasExited) { throw "iridium exited with $($p.ExitCode)" }
          Stop-Process $p

      - name: Installers
        if: matrix.os == 'ubuntu-22.04'
        run: cp scripts/install.sh scripts/install.ps1 out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: latest.json
        env:
          V: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
          BASE: https://github.com/${{ github.repository }}/releases/download/v${{ needs.build.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          base, d = os.environ["BASE"], "dist"
          def entry(asset):
              return {"url": f"{base}/{asset}", "signature": open(f"{d}/{asset}.sig").read()}
          mac = entry("iridium-macos-universal.app.tar.gz")
          json.dump({
              "version": os.environ["V"],
              "notes": os.environ["NOTES"],
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": {
                  "linux-x86_64": entry("iridium-linux-x86_64.AppImage"),
                  "linux-aarch64": entry("iridium-linux-aarch64.AppImage"),
                  "darwin-aarch64": mac,
                  "darwin-x86_64": mac,
                  "windows-x86_64": entry("iridium-windows-x86_64-setup.exe"),
              },
          }, open(f"{d}/latest.json", "w"), indent=2)
          PY
          ls -l dist

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.build.outputs.version }}
          NOTES: ${{ inputs.notes }}
          DRAFT: ${{ inputs.draft }}
        run: |
          args=()
          [ "$DRAFT" = true ] && args+=(--draft)
          gh release create "v$V" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Iridium $V" --notes "$NOTES" "${args[@]}"
